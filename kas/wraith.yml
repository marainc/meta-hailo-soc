# Wraith fleet image — the Hailo BSP plus meta-wraith, built for the hailo15-sbc
# machine (what the Auvidea H100 carrier actually reports and boots).
#
# Build:
#     cd ~/hailo15-yocto/meta-hailo-soc
#     kas build kas/wraith.yml
#
# Includes lowmem.yml, which pulls in hailo15-sbc.yml (machine + core-image-hailo-dev
# target) and caps parallelism so the build fits a 14 GB host.
#
# Output: build/tmp/deploy/images/hailo15-sbc/

header:
  version: 11
  includes:
    - lowmem.yml

repos:
  # Layer lives in this repo (meta-hailo-soc/meta-wraith); no url = same repo.
  meta-wraith:
    layers:
      meta-wraith:

local_conf_header:
  wraith: |
    IMAGE_INSTALL:append = " packagegroup-wraith"
  # hailort-server_%.bbappend (meta-hailo-media-library, vendor commit v1.10.0) targets a
  # base recipe that no longer ships in meta-hailo@kirkstone_v5.0.0. It only backs the
  # optional CLIP PACKAGECONFIG in hailo-analytics-api and the dev SDK toolchain, neither
  # of which wraith uses, so mask it instead of chasing the vendor recipe.
  mask-orphan-bbappends: |
    BBMASK += "meta-hailo-media-library/recipes-hailo-analytics/hailort-server"
  # Same root cause, second bite: meta-hailo-media-library/classes/medialib-sdk.bbclass
  # is globally INHERITed (via that layer's layer.conf) and unconditionally appends
  # hailort-server-staticdev to TOOLCHAIN_TARGET_TASK, which core-image-hailo-dev's own
  # bbappend folds into the image build -- so the dead package was a hard requirement
  # even with the optional CLIP PACKAGECONFIG off. Strip it back out.
  remove-orphan-toolchain-task: |
    TOOLCHAIN_TARGET_TASK:remove = " hailort-server-staticdev"
  # hailo-analytics-api (meta-hailo-media-library) unconditionally DEPENDS on libhailopp,
  # a HailoRT C++ binding that does not exist in meta-hailo@kirkstone_v5.0.0 (only
  # libhailort/libgsthailo/pyhailort/hailortcli ship at 5.0.0) -- it needs a newer
  # HailoRT than this 1.8.0/5.0.0 build targets. wraith/falcon never uses Hailo's own
  # analytics apps (falcon has its own separate perception pipeline), so drop it here;
  # revisit when the branch moves to the 1.12.0/5.3.0 BSP.
  drop-hailo-analytics-api: |
    RDEPENDS:packagegroup-hailo-media-library:remove = " hailo-analytics-api"
