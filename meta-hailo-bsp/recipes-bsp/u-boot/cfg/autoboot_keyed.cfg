# Keyed autoboot: abort only on a specific stop string, not any byte.
#
# abortboot_single_key() (the non-keyed path) does an unconditional "key already
# pressed" tstc() before the countdown even starts, so bootdelay=0 still aborts on
# stray serial traffic -- that is why autoboot_no_menu.cfg's bootdelay=-2 fast path
# was needed. abortboot_key_sequence() (this path) has no such pre-check; it runs a
# plain timed loop and only aborts if the exact CONFIG_AUTOBOOT_STOP_STR is seen, so
# bootdelay=2 is safe here -- FC/MAVLink bytes roll through the match window and
# never match. Do NOT set bootdelay negative with this fragment.
#
# This also closes a hole autoboot_no_menu.cfg alone leaves open: autoboot_command()
# only disables Ctrl-C checking around bootcmd execution when keyed
# (lock = autoboot_keyed() && !AUTOBOOT_KEYED_CTRLC). Without KEYED, a 0x03 byte in
# the MAVLink stream can still abort during bootcmd itself, after abortboot() has
# already passed. Keep AUTOBOOT_KEYED_CTRLC unset so that lock stays true.
#
# Use alongside autoboot_no_menu.cfg (menu off), not instead of it -- the menu
# affects bootdelay_process() regardless of the keyed/single-key choice.
CONFIG_AUTOBOOT_KEYED=y
CONFIG_AUTOBOOT_FLUSH_STDIN=y
CONFIG_AUTOBOOT_STOP_STR="wraithstop"
# CONFIG_AUTOBOOT_KEYED_CTRLC is not set
# CONFIG_AUTOBOOT_ENCRYPTION is not set
