# Disable U-Boot's boot menu so the bootdelay=-2 fast path becomes reachable.
#
# WHY: the Hailo's only exposed UART (ttyS1) is also U-Boot's console. With the
# FC wired to it and streaming MAVLink (~4 kB/s), ANY byte arriving during the
# autoboot window aborts the boot and parks the board at "*** U-Boot Boot Menu ***".
# Observed twice on phoenix0, 2026-08-27/28.
#
# No bootdelay value fixes this while the menu is enabled:
#   2   2 s window; FC traffic aborts it every time.
#   0   abortboot_single_key() still does an unconditional "key already pressed"
#       tstc() BEFORE the countdown loop, so a queued byte aborts anyway.
#  -1   skips the check, but autoboot_command() needs stored_bootdelay != -1 to
#       run bootcmd -> prompt only, never boots.
#  -2   the correct fast path -- but UNREACHABLE with the menu enabled, because
#       bootdelay_process() does `bootdelay = menu_show(bootdelay)` and
#       menu_show() ALWAYS returns -1. Worse, inside the menu -2 is < 0, which
#       selects bootmenu_loop() (wait for a key FOREVER) instead of the counting
#       bootmenu_autoboot_loop(). That is what left phoenix0 unbootable.
#
# With the menu off, bootdelay_process() stops overwriting bootdelay, and
# autoboot_command()'s `stored_bootdelay == -2` branch runs bootcmd WITHOUT ever
# calling abortboot() -- so nothing reads the UART during boot.
#
# AUTOBOOT_MENU_SHOW is only `imply`d by arch/arm/mach-hailo/Kconfig:109, not
# `select`ed, so this explicit negation overrides it.
#
# ⚠️ Set bootdelay=-2 in the U-Boot environment for this to take effect; the
#    fragment alone only makes that value work.
# ⚠️ COST: no boot menu and no way to interrupt boot from serial. Recovery is
#    restoring u-boot-tfa.itb on the SD card's FAT partition (it is removable).
# CONFIG_AUTOBOOT_MENU_SHOW is not set
