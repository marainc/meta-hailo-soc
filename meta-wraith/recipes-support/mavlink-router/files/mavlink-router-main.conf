# mavlink-router config for wraith drones. Installed to /etc/mavlink-router/main.conf.
# Topology per falcon/ONBOARD_COMMS_DRAFT.md §5a. tlog per §E (on-drone copy;
# the ground tlog is separate and lives on hg2).

[General]
# hangar discovery (mother_bird TCP scan) — was mavp2p tcps:5760
TcpServerPort = 5760
ReportStats = false
MavlinkDialect = common
# on-drone tlog (lost with the drone; ground tlog is authoritative)
Log = /var/log/mav_logs
LogMode = while-armed

# ---------- FC serial ----------
# /dev/fc and /dev/mlrs are stable udev symlinks (99-wraith.rules, matched by
# vendor:product) — so this file is IDENTICAL on every drone. Do not hardcode
# /dev/ttyACM* (enumeration order varies) or by-id paths (embed serial numbers).
[UartEndpoint fc]
Device = /dev/fc
Baud = 921600

# ---------- mLRS Rx serial (airborne C2) — FILTERED ----------
# AllowMsgIdOut = drone->ground allow-list from ONBOARD_COMMS_DRAFT §3b.
# Everything not listed (100 Hz guidance, ATTITUDE_QUATERNION, LOCAL_POSITION_NED,
# RAW_IMU, ...) stays on the drone. Inbound (ground->drone) is unfiltered.
#   0 HEARTBEAT · 1 SYS_STATUS · 2 SYSTEM_TIME · 22 PARAM_VALUE · 24 GPS_RAW_INT
#   30 ATTITUDE · 33 GLOBAL_POSITION_INT · 36 SERVO_OUTPUT_RAW · 42 MISSION_CURRENT
#   44 MISSION_COUNT · 47 MISSION_ACK · 51 MISSION_REQUEST_INT · 65 RC_CHANNELS
#   73 MISSION_ITEM_INT · 74 VFR_HUD · 77 COMMAND_ACK · 109 RADIO_STATUS
#   111 TIMESYNC · 130 DATA_TRANSMISSION_HANDSHAKE · 131 ENCAPSULATED_DATA
#   147 BATTERY_STATUS · 148 AUTOPILOT_VERSION · 193 EKF_STATUS_REPORT
#   242 HOME_POSITION · 245 EXTENDED_SYS_STATE · 251 NAMED_VALUE_FLOAT
#   253 STATUSTEXT · 300 PROTOCOL_VERSION · 385 TUNNEL
#   42001 TARGET_UPDATE (ack path) · 42002 FALCON_STATUS
[UartEndpoint mlrs]
Device = /dev/mlrs
Baud = 115200
AllowMsgIdOut = 0,1,2,22,24,30,33,36,42,44,47,51,65,73,74,77,109,111,130,131,147,148,193,242,245,251,253,300,385,42001,42002

# ---------- falcon local endpoint (unfiltered, full rate) ----------
[UdpEndpoint falcon]
Mode = Server
Address = 127.0.0.1
Port = 14550

# ---------- eth GCS endpoint (docked; unfiltered) ----------
[UdpEndpoint eth_gcs]
Mode = Server
Address = 0.0.0.0
Port = 14551
