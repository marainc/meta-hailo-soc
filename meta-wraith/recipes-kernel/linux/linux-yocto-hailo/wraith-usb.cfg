# CDC-ACM: USB serial driver for the ArduPilot flight controller (FlywooH743Pro,
# 1209:5741) and the mLRS Rx (STM32 VCP, 0483:5740) -> /dev/ttyACM*.
# Absent from the stock image: both devices enumerate on USB but never get a
# serial node, so nothing can talk to the FC. Required on every wraith drone.
CONFIG_USB_ACM=m

# USB/IP: import a host-attached USB device over the network so it enumerates as
# a real USB device on the board. Used to validate USB drivers before the
# physical onboard connector existed; retained for bench work.
# VHCI_HCD = import/client side, HOST = export/server side.
CONFIG_USBIP_CORE=m
CONFIG_USBIP_VHCI_HCD=m
CONFIG_USBIP_HOST=m
