# meta-wraith — MARA wraith-fleet additions on top of the Hailo BSP.
#
# Everything MARA-specific lives here so vendor layers (meta-hailo-*) stay
# pristine and BSP bumps rebase cleanly. Extend vendor recipes with .bbappend
# files and config fragments; never edit vendor files in place.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-wraith"
BBFILE_PATTERN_meta-wraith = "^${LAYERDIR}/"

# Priority 10: above every vendor layer (highest vendor is 8,
# meta-hailo-media-library) so our .bbappends and overrides win.
BBFILE_PRIORITY_meta-wraith = "10"

LAYERDEPENDS_meta-wraith = " \
    core \
    meta-hailo-bsp \
"

LAYERSERIES_COMPAT_meta-wraith = "kirkstone"
